[package]
name = "escrow-api"
version = "0.1.0"
edition = "2021"
description = "HTTP API and server for toshi-way escrows"

[[bin]]
name = "toshi-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
escrow-core = { path = "../escrow-core" }
escrow-lnd = { path = "../escrow-lnd" }
escrow-postgres = { path = "../escrow-postgres" }
escrow-sqlite = { path = "../escrow-sqlite" }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
